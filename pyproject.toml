[project]
name = "yogobi-narrator"
version = "0.1.0"
description = "요고비 내레이터 — 백엔드가 계산한 금액을 한국어 문장으로 바꾼다"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
